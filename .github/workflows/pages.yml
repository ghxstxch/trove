name: Publish web app (GitHub Pages)

# Hosts the web app at https://<user>.github.io/<repo>/ so it can be installed
# from a browser, including Safari on iPhone (Share -> Add to Home Screen).
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: web }
      - id: deploy
        uses: actions/deploy-pages@v4
