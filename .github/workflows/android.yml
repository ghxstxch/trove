name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Allow location access (map picker)
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#' android/app/src/main/AndroidManifest.xml
          grep -c ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml
      - name: Use Trove icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*dpi; do
            cp web/icons/icon-192.png "$d/ic_launcher.png"
            cp web/icons/icon-192.png "$d/ic_launcher_round.png"
            cp web/icons/icon-192.png "$d/ic_launcher_foreground.png"
          done
      - name: Build APK (signed with your permanent key if secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.TROVE_KEYSTORE }}
          KEYSTORE_PW: ${{ secrets.TROVE_KEYSTORE_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PW" ]; then
            echo "Signing with permanent Trove key"
            ./gradlew assembleRelease
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/trove.keystore"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/trove.keystore" --ks-key-alias trove \
              --ks-pass env:KEYSTORE_PW --key-pass env:KEYSTORE_PW --out ../trove.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs ../trove.apk | head -3
            rm -f "$RUNNER_TEMP/trove.keystore"
          else
            echo "::warning::TROVE_KEYSTORE secrets not set - building a debug APK with a throwaway key"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../trove.apk
          fi
      - uses: actions/upload-artifact@v4
        with: { name: trove-apk, path: trove.apk }
      - name: Publish release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Trove build ${{ github.run_number }}
          body: Download **trove.apk** below and open it on your Android phone.
          make_latest: true
          files: trove.apk
