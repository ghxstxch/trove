name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Allow location access (map picker)
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#' android/app/src/main/AndroidManifest.xml
          grep -c ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml
      - name: Use Trove icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*dpi; do
            cp web/icons/icon-192.png "$d/ic_launcher.png"
            cp web/icons/icon-192.png "$d/ic_launcher_round.png"
            cp web/icons/icon-192.png "$d/ic_launcher_foreground.png"
          done
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk trove.apk
      - uses: actions/upload-artifact@v4
        with: { name: trove-apk, path: trove.apk }
      - name: Publish release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Trove build ${{ github.run_number }}
          body: Download **trove.apk** below and open it on your Android phone.
          make_latest: true
          files: trove.apk
